model:
  name_or_path: artifacts/checkpoints/qwen25-7b-coca-medical
  fallback_base_model: Qwen/Qwen2.5-7B-Instruct
  torch_dtype: bfloat16
  load_in_4bit: true

data:
  prepared_eval_path: artifacts/data/eval.jsonl
  max_prompt_length: 2048
  max_completion_length: 512

generation:
  temperature: 0.0
  do_sample: false
  batch_size: 4

metrics:
  ece_bins: 10
  output_path: artifacts/eval/qwen25-7b/metrics.json
  predictions_path: artifacts/eval/qwen25-7b/predictions.jsonl
